    <g transform="translate(540 715)">
      <rect width="143" height="28" rx="14" fill="#173347"/><circle cx="16" cy="14" r="4" fill="#37d39b"/><text x="28" y="19" fill="#b8d7ea" font-size="12">IMDSv2 required</text>
      <rect x="153" width="139" height="28" rx="14" fill="#173347"/><circle cx="169" cy="14" r="4" fill="#37d39b"/><text x="181" y="19" fill="#b8d7ea" font-size="12">Encrypted gp3</text>
      <rect x="302" width="142" height="28" rx="14" fill="#173347"/><circle cx="318" cy="14" r="4" fill="#37d39b"/><text x="330" y="19" fill="#b8d7ea" font-size="12">Restricted ingress</text>
    </g>

    <text x="60" y="854" fill="#56718f" font-size="12">PORTFOLIO LAB · This design demonstrates production engineering patterns but is intentionally not a highly available production architecture.</text>
    <text x="1455" y="854" text-anchor="end" fill="#6d87a5" font-size="12" font-weight="650">EthicalNayro</text>
