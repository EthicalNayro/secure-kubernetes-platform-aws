apiVersion: v1
kind: Namespace
metadata:
  name: app1
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app1-sa
  namespace: app1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app1-index
  namespace: app1
data:
  index.html: |
    <h1>Hello from APP1</h1>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1-nginx
  namespace: app1
spec:
  replicas: 1
  selector:
    matchLabels: { app: app1-nginx }
  template:
    metadata:
      labels: { app: app1-nginx }
    spec:
      serviceAccountName: app1-sa
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap: { name: app1-index }
---
apiVersion: v1
kind: Service
metadata:
  name: app1-svc
  namespace: app1
spec:
  selector: { app: app1-nginx }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace-app1
  namespace: app1
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
